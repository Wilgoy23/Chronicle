name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    env:
      # onnxruntime-node's postinstall fetches CUDA binaries on Linux x64 and
      # 404s on runners; embeddings run on CPU, so skip the GPU download.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Cache better-sqlite3 native build
        uses: actions/cache@v4
        with:
          path: node_modules/better-sqlite3/build
          key: ${{ runner.os }}-sqlite3-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -o better-sqlite3

      - name: Resolve version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Optional: default TMDB/RAWG keys so movie/game search works without
      # users bringing their own. Skipped (no file) when the secrets aren't set.
      # Anything bundled can be extracted from the app — treat these as public.
      - name: Bundle default API keys
        shell: bash
        env:
          TMDB_KEY: ${{ secrets.CHRONICLE_TMDB_KEY }}
          RAWG_KEY: ${{ secrets.CHRONICLE_RAWG_KEY }}
        run: |
          if [ -n "$TMDB_KEY$RAWG_KEY" ]; then
            node -e "require('fs').writeFileSync('electron/bundled-keys.json', JSON.stringify({ tmdbKey: process.env.TMDB_KEY || '', rawgKey: process.env.RAWG_KEY || '' }))"
          fi

      - name: Build app
        run: npm run build:renderer && npx electron-builder --publish never --config.extraMetadata.version=${{ env.VERSION }}

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/*.dmg

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
