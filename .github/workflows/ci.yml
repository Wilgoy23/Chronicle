name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright can't install
    # system dependencies for yet.
    runs-on: ubuntu-24.04

    env:
      # onnxruntime-node's postinstall fetches CUDA binaries on Linux x64 and
      # 404s on runners; embeddings run on CPU, so skip the GPU download.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ubuntu-24.04-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ubuntu-24.04-node-

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ubuntu-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ubuntu-electron-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for system Node (unit tests)
        run: npm rebuild better-sqlite3

      - name: Run unit tests
        run: npm test

      - name: Rebuild better-sqlite3 for Electron (E2E tests)
        run: npx @electron/rebuild -f -o better-sqlite3

      - name: Build renderer
        run: npm run build:renderer

      # E2E drives Electron via Playwright's _electron launcher, so only the
      # system libraries are needed, not Playwright's own Chromium download.
      - name: Install Electron system dependencies
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: xvfb-run -a npm run test:e2e
